name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
          - name: Windows x64
            os: windows-2025
            platform: windows
            arch: x64
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            platform: macos
            arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Verify Linux packaging tools
        if: matrix.platform == 'linux'
        run: command -v zip && command -v xvfb-run
      - run: npm ci
      - name: Install WiX Toolset
        if: matrix.platform == 'windows'
        shell: pwsh
        # Hosted images can carry a newer WiX package. Keep the build on the
        # version tested with electron-wix-msi instead of failing Chocolatey's
        # version comparison before packaging starts.
        run: choco install wixtoolset --version=3.14.0 --allow-downgrade -y --no-progress
      - name: Test desktop application
        run: npm test --workspace @allchat/desktop
      - name: Create desktop distribution
        run: npm run make --workspace @allchat/desktop
      - name: Smoke test packaged desktop application
        run: npm run smoke:packaged --workspace @allchat/desktop
      - name: Stage desktop distribution
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          mkdir -p dist
          extension=zip
          if [ "${{ matrix.platform }}" = windows ]; then extension=msi; fi
          source="$(find desktop/out/make -type f -name "*.${extension}" -print -quit)"
          test -n "$source"
          cp "$source" "dist/AllChat-desktop-${version}-${{ matrix.platform }}-${{ matrix.arch }}.${extension}"
      - name: Upload desktop distribution
        uses: actions/upload-artifact@v6
        with:
          name: AllChat-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
