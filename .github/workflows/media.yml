name: Media reliability

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

jobs:
  contract-and-pion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:media:manifest
      - run: go test -buildvcs=false ./internal/media ./internal/relay

  browser-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser runtimes
        timeout-minutes: 5
        shell: bash
        env:
          ALLCHAT_MEDIA_BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium firefox webkit' }}
        run: npx playwright install $ALLCHAT_MEDIA_BROWSERS
      - name: Run real-browser media tests
        timeout-minutes: 8
        shell: bash
        env:
          ALLCHAT_MEDIA_BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium firefox webkit' }}
          ALLCHAT_MEDIA_TIMEOUT_MS: 300000
        run: |
          failed=0
          for browser in $ALLCHAT_MEDIA_BROWSERS; do
            echo "::group::Media reliability: $browser"
            ALLCHAT_MEDIA_BROWSER="$browser" npm run test:media:browser || failed=1
            echo '::endgroup::'
          done
          exit "$failed"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: media-browsers-${{ github.run_attempt }}
          path: .dev/media-tests/
          if-no-files-found: ignore

  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci --prefix mobile
      - run: npm --prefix mobile test -- --runInBand
      - name: Build universal standalone APK
        run: cd mobile/android && ./gradlew assembleStandalone --no-daemon
      - name: Retain standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: allchat-standalone-apk-${{ github.run_attempt }}
          path: mobile/android/app/build/outputs/apk/standalone/app-standalone.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and launch bundled application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            adb install -r mobile/android/app/build/outputs/apk/standalone/app-standalone.apk
            adb shell am start -W -n org.allchat.mobile/.MainActivity
            sleep 5
            adb shell pidof org.allchat.mobile

  nightly-soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Repeat real media lifecycle
        env:
          ALLCHAT_MEDIA_ITERATIONS: 20
        run: npm run test:media:soak
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: media-soak-${{ github.run_attempt }}
          path: .dev/media-tests/
          if-no-files-found: ignore
