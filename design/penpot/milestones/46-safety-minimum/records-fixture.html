<section class="settings-panel"><h2>Safety</h2><section class="safety-panel"><h3>Safety</h3><form><label>Report a Member<select name="memberId" required><option value="">Choose a Member</option><option>Alex</option><option>Morgan</option></select></label><label>Reason<textarea name="reason" minlength="3" maxlength="1000" required></textarea></label><button type="submit">Submit Report</button></form><div class="report-list"><article><strong>Open Report</strong><p>Repeated unwanted messages.</p><button type="button">Resolve</button></article><article><strong>Resolved Report</strong><p>Disruptive posts in the conversation.</p></article></div><form><h4>Moderation Action</h4><label>Action<select name="action"><option>Warn</option><option>Timeout</option><option>Suspend</option><option>Kick</option></select></label><label>Member<select name="moderationMember" required><option>Alex</option><option>Morgan</option></select></label><label>Reason<textarea name="moderationReason" minlength="3" required></textarea></label><label>Duration in minutes<input name="duration" type="number" min="0"></label><button type="submit">Apply Action</button></form><details open><summary>Moderation Records</summary><article><strong>warn</strong><p>Repeated unwanted messages. — Warning issued.</p></article></details><button type="button">Purge Old Records</button><button type="button">Export Account Data</button><form class="danger-zone"><h4>Delete Account</h4><label>Password<input name="password" type="password" required></label><label>Type DELETE<input name="confirmation" pattern="DELETE" required></label><button type="submit">Delete Account</button></form></section></section>
