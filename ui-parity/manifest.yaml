    status: partial

intentional_differences:
  - id: native-window-chrome
    reason: Electron owns the operating-system window and lifecycle.
  - id: multi-instance-rail
    reason: Electron can retain and switch among multiple AllChat Instances.
  - id: native-notifications
    reason: Electron uses native notification delivery instead of Web Push permission UI.
  - id: persistent-asset-cache
    reason: Electron caches authenticated avatars and media on disk.

automation:
  desktop-community-home-default:
    screen: community-home
    state: default
    web_path: /
    width: 1280
    height: 720
    max_meaningful_pixel_difference: 0.05
    evidence_directory: .scratch/desktop-visual-parity/community-home
  desktop-direct-messages-home-default:
    screen: direct-messages-home
    state: default
    web_path: /dms
    width: 1280
    height: 720
    max_meaningful_pixel_difference: 0.05
    evidence_directory: .scratch/desktop-visual-parity/direct-messages-home
  desktop-channel-default:
    screen: text-channel
    state: default
    web_path: /channels/{channelID}
    width: 1280
    height: 720
    max_meaningful_pixel_difference: 0.05
    evidence_directory: .scratch/desktop-visual-parity/latest
  desktop-direct-message-default:
    screen: direct-message
    state: default
    web_path: /channels/{dmID}
    width: 1280
    height: 720
    max_meaningful_pixel_difference: 0.05
    evidence_directory: .scratch/desktop-visual-parity/direct-message
  desktop-admin-dashboard-healthy:
